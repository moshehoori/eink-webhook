name: Test renderer
on:
  push:
    paths: ["renderer/**", ".github/workflows/test.yml"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python -m unittest -v renderer/test_webhook_server.py
